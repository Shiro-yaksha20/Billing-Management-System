name: CI Test & Lint

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compile check
      run: |
        python -m py_compile app/gui_main.py
        python -m py_compile app/whatsapp_client.py
        # Compile everything to be sure
        get-childitem -recurse -include *.py | foreach-object { python -m py_compile $_.fullname }

    - name: Lint with Black
      run: |
        black --check .

    # Optionally lint with Ruff as well or instead
    # - name: Lint with Ruff
    #   run: |
    #     ruff check .

    - name: Run tests with pytest
      # Use xvfb or offscreen platform for GUI tests if needed,
      # but since we're on Windows runner, we might need to set QT_QPA_PLATFORM=offscreen
      env:
        QT_QPA_PLATFORM: offscreen
        PYTHONPATH: .
      run: |
        pytest
