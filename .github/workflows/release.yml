name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: powershell
        run: python -m pytest --tb=short -q

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: PyInstaller build
        shell: powershell
        run: |
          pyinstaller SalonBillingSystem.spec --noconfirm

      - name: Zip executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path dist/SalonBillingSystem/* -DestinationPath releases/SalonBillingSystem-${{ github.ref_name }}.zip -Force

      - name: Zip source code
        shell: powershell
        run: |
          $excludeDirs = @('.vs', 'env', 'venv', '.venv', 'build', 'dist', 'htmlcov', '__pycache__', '.pytest_cache', 'releases')
          $excludeFiles = @('salon_billing.db', '.coverage')
          $items = Get-ChildItem -Path . -Exclude ($excludeDirs + $excludeFiles) | Where-Object { $excludeDirs -notcontains $_.Name }
          Compress-Archive -Path $items.FullName -DestinationPath releases/SalonBillingSystem-${{ github.ref_name }}-source.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SalonBillingSystem-${{ github.ref_name }}
          path: releases/*.zip

  release:
    needs: build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: SalonBillingSystem-${{ github.ref_name }}
          path: releases

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/SalonBillingSystem-${{ github.ref_name }}.zip
            releases/SalonBillingSystem-${{ github.ref_name }}-source.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
