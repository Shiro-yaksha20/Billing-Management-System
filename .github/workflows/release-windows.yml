name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run PyInstaller
      run: pyinstaller SalonBillingSystem.spec

    - name: Zip the output
      run: |
        $version = "${{ github.ref_name }}"
        $asset_name = "SalonBillingSystem-${version}-windows-x64"
        Compress-Archive -Path "dist/SalonBillingSystem" -DestinationPath "${asset_name}.zip"
        echo "ASSET_NAME=${asset_name}.zip" >> $env:GITHUB_ENV

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: "${{ env.ASSET_NAME }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
